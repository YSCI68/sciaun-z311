<title>DNA Replication 3D – step by step</title>
<style>
:root{--bg:#07101f;--pn:#0f1c37;--ln:#25406f;--tx:#e8eefc;--mu:#9db1d8;--ac:#5ec2ff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,"Segoe UI",Arial,sans-serif;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr) auto}
@media(max-width:900px){body{grid-template-columns:1fr;grid-template-rows:60vh auto auto;height:auto}}
#vp{grid-column:1;position:relative;overflow:hidden;min-height:320px}canvas{display:block;width:100%;height:100%}
.lb{position:absolute;pointer-events:none;font-size:12px;font-weight:600;padding:1px 5px;border-radius:4px;background:#07101fcc;white-space:nowrap;transform:translate(-50%,-120%)}
#hud{position:absolute;left:8px;bottom:8px;display:flex;gap:6px;flex-wrap:wrap;font-size:11px;max-width:80%}
#hud span{background:#07101fcc;padding:2px 6px;border-radius:4px}#hud b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}
#zm{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:6px;z-index:5}#zm button{width:46px;height:46px;font-size:24px;line-height:1;padding:0;touch-action:manipulation;background:#0f1c37e6}
#step{position:absolute;left:8px;top:8px;background:#07101fcc;padding:4px 10px;border-radius:6px;font-weight:600}
aside{background:var(--pn);border-left:1px solid var(--ln);padding:12px;overflow:auto;grid-row:1/3;grid-column:2}
@media(max-width:900px){aside{grid-row:auto;grid-column:1;border-left:0}}
#ctl{grid-column:1;background:var(--pn);border-top:1px solid var(--ln);padding:8px}
@media(max-width:900px){#ctl{grid-column:1}}
button,select{font:inherit;font-size:13px;color:var(--tx);background:#1a2f5c;border:1px solid var(--ln);border-radius:6px;padding:6px 10px;cursor:pointer}
button:hover:not(:disabled){background:#244079}button:disabled{opacity:.4;cursor:not-allowed}button.on{background:#17608a;border-color:var(--ac)}
button:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.prog{height:6px;background:#1a2f5c;border-radius:3px;overflow:hidden}.prog i{display:block;height:100%;background:var(--ac)}
#tl{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}#tl button{padding:0;width:20px;height:16px;font-size:10px}
#tl .c{background:#17608a}#tl .d{border-color:#34d399}
h2{font-size:16px;margin:0 0 6px}h4{margin:10px 0 2px;color:var(--ac);font-size:13px}p{margin:2px 0}
.ar{direction:rtl;text-align:right;color:#ffd9a0}.tabs{display:flex;gap:4px;margin-bottom:8px}
.ec{border:1px solid var(--ln);border-left-width:6px;border-radius:6px;padding:6px;margin:5px 0;cursor:pointer;font-size:13px}.ec.sel{background:#1a2f5c}
table{border-collapse:collapse;width:100%;font-size:12px}td,th{border:1px solid var(--ln);padding:3px 5px;text-align:left;vertical-align:top}
.note{color:var(--mu);font-size:12px}
</style></head><body>

<script>
const N=40,DX=.5,R=1.1,D=2.6,SEQ="ATGCGTACCAGTTGACGTAATCGGATCC"+"CCAATCCCAATC",CP={A:"T",T:"A",G:"C",C:"G"};
const BL={A:1.2,G:1.2,C:.8,T:.8,U:.8},BC={A:"#ef6f6f",T:"#f2c94c",U:"#f2c94c",G:"#a78bfa",C:"#4dd0e1"};
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),ez=t=>t*t*(3-2*t),X=i=>(i+.5)*DX;
const EZ={hel:["DNA helicase","#2ec4b6","Unwinds the helix at the origin by breaking H-bonds between bases (pp. 81–82, 103).","Hexameric ring drawn schematically."],
topo:["Topoisomerase (DNA gyrase)","#f2c14e","Relieves supercoiling ahead of the fork by transient cuts; type I cuts one strand, type II both (pp. 44–51, 81). Topo III removes catenates.","Two-lobed gate drawn schematically."],
ssb:["Single-strand binding proteins","#b388eb","Keep separated strands apart so the helix cannot re-form (pp. 81, 103).","Spheres are schematic."],
pri:["Primase","#ff7aa2","Makes the short RNA primer that supplies the 3′-OH; in eukaryotes it is intrinsic to Pol α (pp. 81, 84, 96).","Schematic."],
pol:["DNA polymerase III + sliding clamp (E. coli)","#e5484d","Adds dNTPs to the primer 3′-OH, 5′→3′. Eukaryotes: Pol δ/ε (leading, lagging), Pol α initiates. Clamp keeps it on DNA (pp. 79–80, 86, 93, 95–98).","Schematic."],
p1:["DNA polymerase I (bacterial)","#4cc9f0","5′→3′ exonuclease removes RNA primers while it extends behind: nick translation. Eukaryotes: Pol δ (pp. 88, 95–96).","Schematic."],
shel:["Shelterin (TRF1, TRF2, POT1, TIN2, TPP1)","#b0b8ff","Six-protein telomere complex (p. 106): TRF1 and TRF2 bind double-stranded TTAGGG, POT1 binds the single strand, TIN2 and TPP1 keep them together. It prevents the DNA damage response and is needed to recruit telomerase.","Schematic."],
tel:["Telomerase","#f0abfc","A ribonucleoprotein: a specialised reverse transcriptase carrying its own RNA template (3′-UCCCAAUC in humans, p. 109). It binds the 3′ overhang and adds TTAGGG repeats to the 3′ end of the lagging-strand template; low in somatic cells, high in germ-line and stem cells and ~90% of cancers (pp. 109–116).","Schematic. Its template is RNA; the DNA is what it makes."],
lig:["DNA ligase","#e9ecef","Forms the last missing bond (3′-OH + 5′-phosphate, phosphodiester) between fragments (pp. 81, 88–89).","Schematic."]};
/* ---------- steps: [title, diff, focus idx, focus dist, enzyme, where, what, changes, why, arabic] ---------- */
const ST=[
["Intact double helix",{},20,26,"None","Whole DNA segment","Two antiparallel strands wound into a right-handed double helix (B-form: 10 bp per 3.4 nm turn).","Nothing yet: this is the starting state.","Replication copies this molecule before cell division (p. 75).","جزيء DNA حلزوني مزدوج."],
["Sugar–phosphate backbone",{bb:1},20,22,"None","The two outer spirals","The backbones are chains of sugar and phosphate joined by 3′–5′ phosphodiester bonds.","Backbone spheres highlighted.","The backbone is what DNA polymerase extends later (pp. 22–24).","الهيكل السكري الفوسفاتي."],
["Base pairs and hydrogen bonds",{bb:0,hb:1,spin:0},6,11,"None","Centre of the helix","Bases pair A–T (2 H-bonds) and G–C (3 H-bonds). Each pair is purine + pyrimidine, so the width is constant.","H-bonds highlighted; purines are longer than pyrimidines.","Specific pairing lets each strand template its partner (p. 26).","A–T رابطتان، G–C ثلاث روابط."],
["Antiparallel strands",{hb:0,an:1,en:1},20,24,"None","Both strands, full length","One strand runs 5′→3′ right-to-left, the other left-to-right.","Arrows and 5′/3′ ends appear.","Polymerase only works 5′→3′, which causes leading/lagging strands (p. 76).","الشريطان متعاكسان."],
["Origin of replication",{an:0,org:1,cx:3,cd:13},3,13,"None","A–T rich site at the left end","Replication begins at a specific origin rich in A–T (2 H-bonds, easier to open).","Origin region highlighted. Eukaryotes: hundreds to thousands of origins; prokaryotes: about one (p. 83).","Starting at a weak site needs less energy to open the helix.","نقطة بدء النسخ غنية بـ A–T."],
["Helicase opens the origin",{org:0,hel:1,oR:6,str:1,cx:6,cd:13},6,13,"DNA helicase","At the fork, around the DNA","Helicase breaks the H-bonds and separates the strands.","Strands split into a Y-shaped fork; the helix ahead becomes over-twisted.","Templates must be exposed before they can be copied (p. 82).","الهليكيز يفتح الشريطين."],
["Topoisomerase relieves strain",{topo:1,str:0,cx:12,cd:14},12,14,"Topoisomerase","On the duplex ahead of the fork","It transiently cuts DNA, lets it swivel, and reseals it.","Over-twisting ahead of the fork disappears.","Unwinding creates supercoils that would knot DNA and block the fork (pp. 44–48)."," التوبويزوميريز يزيل الالتواء."],
["SSBs coat the templates",{ssb:1,cx:6,cd:14},6,14,"Single-strand binding proteins","On the exposed template strands","SSBPs bind the single strands.","Purple proteins appear on both templates.","They stop the strands re-annealing (pp. 81, 103).","بروتينات تثبت الشريط المفرد."],
["Bubble grows: two forks",{oR:16,cx:10,cd:17},10,17,"Helicase","Both ends of the bubble","Forks move apart in opposite directions (bidirectional). Only the right fork is drawn; the left is its mirror.","More template is exposed.","Bidirectional replication copies DNA faster; bubbles later fuse (p. 83).","النسخ في اتجاهين."],
["Primase binds the template",{pase:1,paseX:1,paseS:0,cx:3,cd:10},3,10,"Primase","Top template near the origin","Primase sits on the top template where synthesis begins.","Pink primase appears.","DNA polymerase cannot start a chain by itself (p. 84).","البرايميز يرتبط بالقالب."],
["RNA primer is built",{pr0:3,paseX:2,cx:3,cd:9},3,9,"Primase","Top template, i.e. positions 1–3","Primase adds RNA nucleotides one at a time, 5′→3′, pairing A–U and G–C.","A short orange RNA primer forms.","The primer is complementary to the template (p. 84).","يبني بادئ RNA قصير."],
["The free 3′-OH",{oh:1,pase:0,cx:3,cd:9},3,9,"None (primer)","At the primer's 3′ end","The primer's 5′ end is at the left and its 3′-OH end points toward the fork.","3′ end highlighted; primase leaves.","Polymerase adds new nucleotides only at a free 3′-OH (pp. 80–81).","مجموعة 3′-OH ضرورية."],
["DNA polymerase III arrives",{oh:0,pol:1,cl:1,cx:5,cd:10},5,10,"DNA pol III + sliding clamp","At the primer–template junction","A clamp loader recognises the junction and loads the clamp; polymerase binds the primer.","Red polymerase and white clamp appear. Eukaryotes: Pol α then Pol δ/ε.","The clamp keeps the polymerase attached (p. 93).","البوليميراز يرتبط بالبادئ."],
["First DNA nucleotides",{ld:4,oR:20,cx:5,cd:11},5,11,"DNA pol III","At the 3′ end of the primer","Complementary dNTPs enter one at a time and pair (A–T, G–C). The 3′-OH attacks the 5′ phosphate; energy comes from the broken phosphate bond.","Green nucleotides join the primer's 3′ end.","This is the polymerase reaction (p. 80).","نيوكليوتيدات تضاف واحدًا تلو الآخر."],
["Elongation 5′→3′ toward the fork",{ld:20,oR:28,cx:12,cd:15},12,15,"DNA pol III","Leading strand, moving with the fork","Polymerase reads the template 3′→5′ and extends the new strand 5′→3′ continuously toward the fork.","The leading strand grows; helicase moves ahead.","The leading template is exposed at its 3′ end, so one primer suffices (p. 86).","الشريط القائد يُبنى باستمرار."],
["New backbone forms",{bn:1,cx:12,cd:12},12,12,"DNA pol III","The new strand","Each new nucleotide is linked into the new sugar–phosphate backbone.","New backbone highlighted.","This is the phosphodiester chain of the new strand (p. 80).","هيكل جديد."],
["Why the lagging strand is discontinuous",{bn:0,oR:30,cx:18,cd:20},18,20,"None","Bottom template","The bottom template is exposed 5′→3′, but the new strand must still grow 5′→3′, i.e. away from the fork.","Fork is opened further.","So it is made backward in short pieces (p. 87).","الشريط المتأخر يُبنى على قطع."],
["Primase primes fragment 1",{pase:1,paseS:1,paseX:5,pf0:3,cx:6,cd:11},6,11,"Primase","Bottom template, at positions 6–8","A new RNA primer is made on the lagging template.","Orange primer on the bottom template; its 5′ end is on the right.","Every Okazaki fragment needs its own primer (p. 87).","بادئ جديد لكل قطعة."],
["Okazaki fragment 1 extends",{pase:0,polB:1,act:0,fd0:5,cx:6,cd:11},6,11,"DNA pol III","Lagging strand, moving left","Polymerase extends the primer 5′→3′ away from the fork.","Green DNA grows leftwards.","It copies the template 3′→5′ while synthesising 5′→3′ (p. 85).","قطعة أوكازاكي الأولى."],
["Fragment 2: primer and DNA",{oR:34,pase:1,paseX:13,pf1:3,fd1:5,act:1,cx:12,cd:13},12,13,"Primase, then pol III","Lagging strand, positions 9–16","The cycle repeats as the fork advances.","Second fragment added behind fragment 1.","Fragments are 100–200 nt in eukaryotes, 1000–2000 nt in prokaryotes (this model is schematic).","تكرار الدورة."],
["Fragment 3",{oR:38,paseX:21,pf2:3,fd2:5,act:2,cx:20,cd:15},20,15,"Primase, then pol III","Lagging strand, positions 17–24","Same cycle again.","Third fragment.","Same reason as before.","القطعة الثالثة."],
["Fragment 4",{oR:40,paseX:29,pf3:3,fd3:5,act:3,cx:28,cd:15},28,15,"Primase, then pol III","Lagging strand, positions 25–32","Last fragment in this segment.","Fourth fragment; 3′ ends point left, 5′ ends right.","Shows the pattern of 5′/3′ ends.","القطعة الرابعة."],
["Leading strand reaches the end",{ld:37,pase:0,hel:0,topo:0,cx:30,cd:15},30,15,"DNA pol III","Leading strand","Continuous synthesis finishes this segment.","Leading strand complete.","One primer was enough (p. 86).","اكتمل الشريط القائد."],
["Compare leading and lagging",{cx:20,cd:27},20,27,"None","Both new strands","Leading: continuous, toward the fork, one primer. Lagging: fragments, away from the fork, many primers.","Camera pulls back.","Both strands are made 5′→3′ (p. 104).","مقارنة."],
["Pol I removes RNA primers",{p1:1,p1x:[24.5],R0:[3,0,.3],R1:[3,0,.3],R2:[3,.3,.65],R3:[3,.65,1],R4:[3,.65,1],cx:14,cd:17},14,17,"DNA polymerase I (Pol δ in eukaryotes)","At each primer, from its 5′ end","Its 5′→3′ exonuclease degrades each primer.","Orange primers vanish, leaving gaps. The last primer at each chromosome end is removed too, but nothing can fill that gap (see the telomere steps).","RNA must not stay in the DNA (pp. 88, 95–96).","إزالة بادئات RNA."],
["Pol I fills the gaps with DNA",{p1x:[8.5],F0:[3,0,.3],F1:[3,0,.3],F2:[3,.3,.65],F3:[3,.65,1],cx:14,cd:17},14,17,"DNA polymerase I","Behind the removed primers","It extends the neighbouring fragment's 3′ end into the gap (nick translation).","Green DNA replaces the RNA; one bond is still missing between fragments.","The strand becomes all DNA (p. 88).","استبدال RNA بـ DNA."],
["DNA ligase seals the nicks",{p1:0,lg:1,lgx:[23.5],L1:[1,0,.3],L2:[1,.35,.65],L3:[1,.7,1],cx:16,cd:11},16,11,"DNA ligase","At each nick between fragments","Ligase joins the 3′-OH of one fragment to the 5′-phosphate of the next, forming a phosphodiester bond.","Backbone links appear across the nicks: the lagging strand is continuous.","This makes the final missing bond (pp. 88–89).","الليجيز يلصق القطع."],
["Proofreading: a mismatch",{lg:0,prf:1,cx:38,cd:9},38,9,"DNA polymerase (illustrative)","The 3′ end of the leading strand","A wrong nucleotide (red, T opposite G) is inserted; there is no proper pairing.","Red mismatched nucleotide.","Polymerase error rate is <1 per 10⁷ nt; a mismatch blocks extension (p. 102). Schematic example.","نيوكليوتيد خاطئ."],
["Exonuclease removes it",{prf:2,cx:38,cd:9},38,9,"3′→5′ exonuclease (Pol δ)","3′ end of the new strand","The mismatched nucleotide is cut off the 3′ end.","Red nucleotide leaves.","Proofreading plus mismatch repair gives <1 error per 10⁹ nt (pp. 98, 102).","إزالة الخطأ."],
["Correct nucleotide inserted",{prf:3,cx:38,cd:9},38,9,"DNA polymerase","3′ end","The correct C pairs with G and extension resumes.","Green nucleotide restored.","Post-replication mismatch repair also distinguishes new from old strand (p. 102).","تصحيح."],
["Strands re-wind into two helices",{bb:0,ssb:0,ret:1,pol:0,polB:0,cl:0,cx:20,cd:24},20,24,"None","Each parental strand with its new strand","Each template pairs with its new strand and winds into a helix. Each chromosome end keeps a short unpaired 3′ overhang.","Two double helices.","Each molecule is now a duplex (p. 83).","كل جزيء يلتف حلزونيًا."],
["Daughter molecules separate",{sep:1,cx:20,cd:30},20,30,"None","Both daughter molecules","The two molecules move apart.","Two separate DNA molecules.","They go to the two daughter cells.","انفصال الجزيئين."],
["Semiconservative result",{semi:1},20,30,"None","Both daughters","Each daughter has one old (blue) strand and one new (green) strand: semiconservative (Meselson and Stahl, 1958).","Strands labelled old/new.","Proved in 1958 (p. 78). Next: what happens at the chromosome ends.","شريط قديم + شريط جديد."],
["Telomeres and the end-replication problem",{ov:1,gp:1,cx:48,cd:17,cty:-2.8},48,17,"None yet (linear eukaryotic chromosome end)","Right end of the lower daughter chromosome","The lagging strand cannot be copied to the very end: the last RNA primer was removed, but no upstream 3′-OH exists to fill the gap, so the template's 3′ end sticks out as a single-stranded 3′ overhang. Telomeres are 3–20 kb of …TTAGGG… repeats ending in this overhang.","The red box marks the unreplicated end: the new strand stops short of the template's 3′ end.","Without a fix each round of replication shortens the chromosome (pp. 104–108). This applies to linear eukaryotic chromosomes only, not to ordinary DNA replication or circular bacterial DNA.","النهاية لا تُنسخ بالكامل فيقصر الكروموسوم."],
["Telomerase binds the 3′ overhang",{gp:0,trP:1,cx:47,cd:17},47,17,"Telomerase (ribonucleoprotein with its own RNA)","3′ end of the DNA strand","Telomerase is a specialised reverse transcriptase. The DNA's 3′ end (…AG-3′) base-pairs with the 3′ end of the telomerase RNA template (pink, 3′-UCCCAAUC-5′).","Pink RNA appears paired to the DNA end; the rest of the RNA is an unpaired template.","The RNA, not the DNA, carries the sequence information, and it is separate from the DNA being made (pp. 109–110).","التيلوميراز يحمل RNA خاصًا به كقالب."],
["Telomerase adds the first repeat",{ext:6,cx:47,cd:17},47,17,"Telomerase (reverse transcriptase activity)","At the 3′ end of the DNA strand","Reading the RNA template, telomerase adds DNA nucleotides one at a time to the 3′ end, 5′→3′: G, G, T, T, A, G.","Six green nucleotides join the 3′ end. The 5′ end is never extended.","Polymerases extend only a 3′-OH; telomerase elongates the 3′ end of the template strand (p. 109).","يضيف نيوكليوتيدات إلى النهاية 3′ فقط."],
["Telomerase repositions (translocation)",{trs:6,cx:49,cd:17},49,17,"Telomerase","RNA template slides along the DNA","The RNA releases and moves 6 nucleotides, so its 3′ part pairs with the new DNA 3′ end (…AG) again.","Pink RNA shifts right and re-pairs; the green DNA does not move.","This resets the template so the same RNA can be copied again and again.","ينزلق القالب ليكرر العملية."],
["Telomerase adds the second repeat",{ext:12,cx:49,cd:17},49,17,"Telomerase","3′ end of the growing DNA","Six more nucleotides (GGTTAG) are added by copying the same RNA region.","Twelve repeat nucleotides in total.","Repeating the cycle builds long telomeric repeats (TTAGGG)n.","تكرار الدورة."],
["Repositions again",{trs:12,cx:51,cd:17},51,17,"Telomerase","RNA template slides along the DNA","A second translocation, same mechanism.","RNA moves 6 nt to the right.","The cycle can go on as long as telomerase stays bound.","انزلاق ثانٍ."],
["Telomerase adds the third repeat",{ext:18,cx:51,cd:17},51,17,"Telomerase","3′ end of the growing DNA","The last repeat of this animation: 18 nucleotides added in total. Real telomeres gain many repeats.","The 3′ overhang is now much longer.","Lengthens the template for the complementary strand (p. 109).","التكرار الثالث."],
["Telomerase leaves",{trP:0,cx:50,cd:17},50,17,"None","3′ overhang","Telomerase dissociates. The 3′ overhang now carries telomeric repeats; shelterin (TRF1, TRF2, POT1, TIN2, TPP1) and the T-loop protect the end (pp. 105–106).","Telomerase and its RNA disappear.","Shelterin prevents a DNA-damage response and helps recruit telomerase.","يغادر التيلوميراز."],
["Primase primes the complementary strand",{tpr:1,cpr:3,cx:46,cd:17},46,17,"Primase (intrinsic to Pol α in eukaryotes)","On the lengthened 3′ overhang","The complementary strand is made by the ordinary lagging-strand machinery, not by telomerase: an RNA primer (orange) forms 5′→3′ on the overhang.","An orange primer appears; a 3′ overhang remains beyond it.","DNA polymerase needs a primer 3′-OH (pp. 84, 96).","بادئ RNA على الشريط المكمل."],
["DNA polymerase fills in the gap",{tpr:0,tpo:1,cdn:12,cx:44,cd:17},44,17,"DNA polymerase (Pol α/δ) then ligase","From the primer toward the chromosome interior","The primer is extended 5′→3′, leftwards, until it meets the existing strand.","Green DNA fills the gap.","This completes the double-stranded telomere (pp. 88, 96).","يملأ البوليميراز الفجوة."],
["Pol δ removes the terminal RNA primer",{crm:3,tpd:12.6,cx:46,cd:18},46,18,"Pol δ in eukaryotes (DNA Pol I in bacteria)","The RNA primer at the 5′ end of the new strand","The polymerase's primer-removal activity (Pol δ in eukaryotes, Pol I in bacteria, p. 96) removes the three RNA nucleotides of the primer.","The orange primer disappears, leaving a gap at the very end of the new strand.","RNA must not stay in the DNA (pp. 88, 96).","إزالة بادئ RNA."],
["Pol δ replaces the RNA with DNA nucleotides",{cfl:3,cLg:1,cx:46,cd:18},46,18,"Pol δ (then DNA ligase)","The gap left by the removed primer","Pol δ adds three DNA nucleotides in the gap, copying the template, so the strand becomes all DNA; ligase then seals the nick with the older fragment (phosphodiester bond).","Three green DNA nucleotides replace the orange RNA ones.","This completes primer replacement as described for lagging-strand synthesis (pp. 88, 96). Note: at a real chromosome end the lecture says the very last primer's gap cannot be filled because no 3′-OH lies upstream (p. 107); this step shows the general replacement mechanism.","استبدال RNA بـ DNA."],
["Result: end-replication problem compensated",{tpo:0,cx:46,cd:18},46,18,"None","Chromosome end","The chromosome end has gained telomeric repeats and keeps a 3′ overhang. Telomerase activity is low in most somatic cells but present in germ-line cells, stem cells and over 90% of cancer cells.","Longer telomere.","Short telomeres are linked to senescence, cell death and premature ageing (pp. 111–116).","الخلايا السرطانية تحتفظ بنشاط التيلوميراز."],
